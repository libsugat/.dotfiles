general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.dotfiles/images/background.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    blur_size = 2
    brightness = 0.85
}

# Date (Above the clock)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgba(220, 220, 230, 0.85)
    font_size = 22
    font_family = Varela Round
    position = 0, 235
    halign = center
    valign = center
}

# Main Clock
label {
    monitor =
    text = $TIME
    color = rgba(245, 245, 250, 1.0)
    font_size = 140
    font_family = Varela Round
    position = 0, 110
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# Greeting
label {
    monitor =
    text = Hi there, $USER
    color = rgba(220, 220, 230, 0.9)
    font_size = 24
    font_family = Varela Round
    position = 0, -40
    halign = center
    valign = center
}

# Password Input (Solid colors, no gradients)
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true

    # Solid frosted-glass look with crisp single-color states
    inner_color = rgba(20, 20, 28, 0.55)
    outer_color = rgba(255, 255, 255, 0.35)
    check_color = rgba(166, 227, 161, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)

    font_color = rgba(245, 245, 250, 1.0)
    fade_on_empty = false
    rounding = 24
    placeholder_text = <span foreground="##cdd6f488">Enter Password...</span>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, 90
    halign = center
    valign = bottom
}
